<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173b57"><title>PWA Learning Report</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body><header><h1>PWA Learning Report</h1><p>Absensi Pembelajaran</p></header><main>
<section id="loginCard" class="card"><div class="tabs"><button id="teacherTab" class="tab active" type="button">Abah/Ambu</button><button id="studentTab" class="tab" type="button">Santri</button></div>
<div id="teacherLogin"><h2>Login Abah/Ambu</h2><label>Email</label><input id="email" type="email" autocomplete="username" placeholder="Email"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Password"><button id="login">Masuk</button></div>
<div id="studentLogin" class="hidden"><h2>Login Santri</h2><p class="muted">Pilih kelas dan nama sendiri, lalu masukkan password.</p><label>Kelas</label><select id="studentClassSelect"><option value="">Memuat kelas...</option></select><label>Nama Santri</label><select id="studentSelect"><option value="">Memuat daftar santri...</option></select><label>Password</label><input id="studentPassword" type="password" autocomplete="current-password" placeholder="Password"><button id="studentLoginBtn">Masuk</button><p class="muted hint">Password awal santri: <b>pwa12345</b></p></div><p id="loginMsg" class="msg"></p></section>
<section id="teacherApp" class="hidden"><div class="card"><div class="top"><div><b id="who"></b><div id="role" class="muted"></div></div><button id="logout" class="secondary">Keluar</button></div></div>
<div class="card"><label>Tanggal</label><input id="date" type="date"><label>Sesi</label><select id="session"><option value="shubuh">Bada Shubuh — Halaqah Tahfizh</option><option value="maghrib">Bada Magrib — Leveling Quran</option><option value="isya">Bada Isya — Kepesantrenan</option></select><div id="schedule" class="notice"></div></div>
<div class="card"><label>Kelas</label><select id="class"></select><div class="stats"><span>Hadir <b id="present">0</b></span><span>Tidak hadir <b id="absent">0</b></span><span>Total <b id="total">0</b></span></div><div id="students"></div><button id="save">Simpan Absensi</button><p id="saveMsg" class="msg"></p></div></section>
<section id="studentApp" class="hidden"><div class="card"><div class="top"><div><b id="studentWho"></b><div id="studentClass"></div></div><button id="studentLogout" class="secondary">Keluar</button></div></div>
<div class="card"><h2>Rekap Kehadiran</h2><p id="studentPeriod" class="muted"></p><div class="stats"><span>Hadir <b id="weekPresent">0</b></span><span>Tidak hadir <b id="weekAbsent">0</b></span><span>Persentase <b id="weekPercent">0%</b></span></div></div>
<div class="card"><h3>7 Hari Terakhir</h3><div id="attendanceHistory"></div><p id="studentMsg" class="msg"></p></div></section></main>
<script>
const SUPABASE_URL='https://gvlkpglgxqmzfofpfrae.supabase.co';const SUPABASE_KEY='sb_publishable_iUC8839XKlS5hZ10oL6tDg_hgU2udB5';const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const dayNames=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];let teacher=null,subject=null,students=[];let studentList=[];const $=id=>document.getElementById(id);$('date').value=new Date().toISOString().slice(0,10);
function setLoginMode(mode){let teacherMode=mode==='teacher';$('teacherLogin').classList.toggle('hidden',!teacherMode);$('studentLogin').classList.toggle('hidden',teacherMode);$('teacherTab').classList.toggle('active',teacherMode);$('studentTab').classList.toggle('active',!teacherMode);$('loginMsg').textContent='';if(!teacherMode)loadStudentList()}
async function loadStudentList(){if(studentList.length)return;let {data,error}=await sb.rpc('get_student_login_list');if(error){$('loginMsg').textContent='Daftar santri belum siap. Jalankan student-portal-setup.sql di Supabase SQL Editor.';return}studentList=data||[];let classes=[...new Set(studentList.map(x=>x.class_id))].sort();$('studentClassSelect').innerHTML='<option value="">Pilih kelas</option>'+classes.map(c=>`<option value="${c}">Kelas ${c}</option>`).join('');renderStudentNames()}
function renderStudentNames(){let c=$('studentClassSelect').value;let list=studentList.filter(x=>!c||x.class_id===c).sort((a,b)=>a.name.localeCompare(b.name,'id'));$('studentSelect').innerHTML='<option value="">Pilih nama santri</option>'+list.map(x=>`<option value="${x.student_id}">${x.name}</option>`).join('')}
async function login(){let email=$('email').value.trim(),password=$('password').value;$('loginMsg').textContent='Memproses...';let {error}=await sb.auth.signInWithPassword({email,password});if(error){$('loginMsg').textContent=error.message;return}await boot()}
async function studentLogin(){let studentId=Number($('studentSelect').value),password=$('studentPassword').value;if(!studentId||!password){$('loginMsg').textContent='Pilih kelas, nama, dan masukkan password.';return}$('loginMsg').textContent='Memeriksa...';let {data,error}=await sb.rpc('student_login',{p_student_id:studentId,p_password:password});if(error||!data?.length){$('loginMsg').textContent='Nama atau password salah.';return}showStudent(data[0])}
async function boot(){let {data:{user}}=await sb.auth.getUser();if(!user){showLogin();return}let {data:t}=await sb.from('teachers').select('*').eq('email',user.email).maybeSingle();if(t){teacher=t;$('who').textContent=t.name;$('role').textContent=t.role==='admin'?'Admin':'Pengajar';$('loginCard').classList.add('hidden');$('teacherApp').classList.remove('hidden');$('studentApp').classList.add('hidden');await loadSubjects();await loadClasses();await refresh();return}await sb.auth.signOut();showLogin()}
function showLogin(){$('loginCard').classList.remove('hidden');$('teacherApp').classList.add('hidden');$('studentApp').classList.add('hidden')}
async function showStudent(s){$('studentWho').textContent=s.name;$('studentClass').textContent='Kelas '+s.class_id;$('loginCard').classList.add('hidden');$('teacherApp').classList.add('hidden');$('studentApp').classList.remove('hidden');await loadStudentAttendance(s)}
function isoDate(d){return d.toISOString().slice(0,10)}
function niceDate(v){let d=new Date(v+'T00:00:00');return d.toLocaleDateString('id-ID',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'})}
async function loadStudentAttendance(s){let end=new Date();let start=new Date();start.setDate(end.getDate()-6);$('studentPeriod').textContent=`${niceDate(isoDate(start))} – ${niceDate(isoDate(end))}`;$('studentMsg').textContent='Memuat...';let {data,error}=await sb.rpc('get_student_attendance',{p_student_id:s.student_id,p_start_date:isoDate(start),p_end_date:isoDate(end)});if(error){$('studentMsg').textContent='Gagal memuat rekapan: '+error.message;return}let rows=data||[],present=rows.filter(x=>x.present).length,absent=rows.filter(x=>!x.present).length,total=rows.length;$('weekPresent').textContent=present;$('weekAbsent').textContent=absent;$('weekPercent').textContent=total?Math.round(present/total*100)+'%':'0%';$('attendanceHistory').innerHTML=rows.length?rows.map(x=>`<div class="attendance-row"><div><b>${niceDate(x.attendance_date)}</b><div class="muted">${x.subject_name||'Pembelajaran'} • ${sessionName(x.session)}</div></div><span class="status ${x.present?'present-status':'absent-status'}">${x.present?'✓ Hadir':'✕ Tidak hadir'}</span></div>`).join(''):'<div class="notice">Belum ada data kehadiran dalam 7 hari terakhir.</div>';$('studentMsg').textContent=''}
function sessionName(s){return s==='shubuh'?'Bada Shubuh':s==='maghrib'?'Bada Magrib':'Bada Isya'}
async function loadSubjects(){let {data}=await sb.from('teacher_subjects').select('subject_id, subjects(id,name)').eq('teacher_id',teacher.id);subject=data?.[0]?.subjects||null}
async function loadClasses(){let {data}=await sb.from('classes').select('*').order('id');$('class').innerHTML=(data||[]).map(x=>`<option value="${x.id}">Kelas ${x.id}</option>`).join('')}
function schedule(){let d=dayNames[new Date($('date').value+'T00:00:00').getDay()],s=$('session').value,c=$('class').value;let map={Senin:{VII:['Aqidah','Abah Iqin'],VIII:['Fiqih','Ambu Ima'],IX:['Hadist','Ambu Dhilla']},Selasa:{VII:['Hadist','Ambu Dhilla'],VIII:['Aqidah','Abah Iqin'],IX:['Baqu','Abah Deden']},Rabu:{VII:['Fiqih','Ambu Ima'],VIII:['Shiroh','Abah Alam'],IX:['Aqidah','Abah Iqin']},Kamis:{VII:['Shiroh','Abah Alam'],VIII:['Baqu','Abah Deden'],IX:['Fiqih','Ambu Ima']},Jumat:{VII:['Baqu','Abah Deden'],VIII:['Hadist','Ambu Dhilla'],IX:['Shiroh','Abah Alam']}};if(s==='maghrib')return ['Selasa','Rabu','Kamis'].includes(d)?`Leveling Quran • Abah Alam • ${d} • Kelas ${c}`:`Tidak ada Leveling Quran pada ${d}`;if(s==='shubuh')return ['Selasa','Rabu','Kamis','Jumat','Sabtu'].includes(d)?`Halaqah Tahfizh • Abah Dendi • ${d} • Kelas ${c}`:`Tidak ada Halaqah pada ${d}`;let x=map[d]?.[c];return x?`${x[0]} • ${x[1]} • ${d} • Kelas ${c}`:`Tidak ada kelas Kepesantrenan pada ${d}`}
async function refresh(){$('schedule').textContent=schedule();let c=$('class').value;let {data}=await sb.from('students').select('id,name').eq('class_id',c).order('name');students=data||[];let existing={};if(subject){let q=await sb.from('attendance').select('student_id,present').eq('attendance_date',$('date').value).eq('session',$('session').value).eq('class_id',c).eq('subject_id',subject.id);(q.data||[]).forEach(x=>existing[x.student_id]=x.present)}$('students').innerHTML=students.map((x,i)=>`<label class="student"><input type="checkbox" data-id="${x.id}" ${existing[x.id]?'checked':''}><span>${i+1}. ${x.name}</span></label>`).join('');update()}
function update(){let b=[...document.querySelectorAll('.student input')],p=b.filter(x=>x.checked).length;$('present').textContent=p;$('total').textContent=b.length;$('absent').textContent=b.length-p}
async function save(){if(!subject){$('saveMsg').textContent='Mata pelajaran pengajar belum diatur.';return}let rows=[...document.querySelectorAll('.student input')].map(x=>({attendance_date:$('date').value,session:$('session').value,class_id:$('class').value,subject_id:subject.id,student_id:+x.dataset.id,present:x.checked,recorded_by:teacher.id}));let {error}=await sb.from('attendance').upsert(rows,{onConflict:'attendance_date,session,class_id,subject_id,student_id'});$('saveMsg').textContent=error?'Gagal: '+error.message:'✓ Absensi tersimpan online.'}
$('teacherTab').onclick=()=>setLoginMode('teacher');$('studentTab').onclick=()=>setLoginMode('student');$('studentClassSelect').onchange=renderStudentNames;$('login').onclick=login;$('studentLoginBtn').onclick=studentLogin;$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};$('studentLogout').onclick=()=>{location.reload()};$('class').onchange=refresh;$('session').onchange=refresh;$('date').onchange=refresh;document.addEventListener('change',e=>{if(e.target.matches('.student input'))update()});$('save').onclick=save;boot();
</script></body></html>
