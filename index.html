<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173b57"><title>PWA Learning Report</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body><header><h1>PWA Learning Report</h1><p>Absensi Pembelajaran</p></header><main>
<section id="loginCard" class="card"><h2>Login Abah/Ambu</h2><label>Email</label><input id="email" type="email" autocomplete="username" placeholder="Email"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Password"><button id="login">Masuk</button><p id="loginMsg" class="msg"></p></section>
<section id="app" class="hidden"><div class="card"><div class="top"><div><b id="who"></b><div id="role" class="muted"></div></div><button id="logout" class="secondary">Keluar</button></div></div>
<div class="card"><label>Tanggal</label><input id="date" type="date"><label>Sesi</label><select id="session"><option value="shubuh">Bada Shubuh — Halaqah Tahfizh</option><option value="maghrib">Bada Magrib — Leveling Quran</option><option value="isya">Bada Isya — Kepesantrenan</option></select><div id="schedule" class="notice"></div></div>
<div class="card"><label>Kelas</label><select id="class"></select><div class="stats"><span>Hadir <b id="present">0</b></span><span>Tidak hadir <b id="absent">0</b></span><span>Total <b id="total">0</b></span></div><div id="students"></div><button id="save">Simpan Absensi</button><p id="saveMsg" class="msg"></p></div></section></main>
<script>
const SUPABASE_URL='https://gvlkpglgxqmzfofpfrae.supabase.co';const SUPABASE_KEY='sb_publishable_iUC8839XKlS5hZ10oL6tDg_hgU2udB5';const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const dayNames=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];let teacher=null,subject=null,students=[];const $=id=>document.getElementById(id);$('date').value=new Date().toISOString().slice(0,10);
async function login(){let email=$('email').value.trim(),password=$('password').value;$('loginMsg').textContent='Memproses...';let {error}=await sb.auth.signInWithPassword({email,password});if(error){$('loginMsg').textContent=error.message;return}await boot()}
async function boot(){let {data:{user}}=await sb.auth.getUser();if(!user){$('loginCard').classList.remove('hidden');$('app').classList.add('hidden');return}let {data:t,error}=await sb.from('teachers').select('*').eq('email',user.email).single();if(error){$('loginMsg').textContent='Login berhasil, tetapi profil Abah/Ambu belum didaftarkan.';return}teacher=t;$('who').textContent=t.name;$('role').textContent=t.role==='admin'?'Admin':'Pengajar';$('loginCard').classList.add('hidden');$('app').classList.remove('hidden');await loadSubjects();await loadClasses();await refresh()}
async function loadSubjects(){let {data}=await sb.from('teacher_subjects').select('subject_id, subjects(id,name)').eq('teacher_id',teacher.id);subject=data?.[0]?.subjects||null}
async function loadClasses(){let {data}=await sb.from('classes').select('*').order('id');$('class').innerHTML=(data||[]).map(x=>`<option value="${x.id}">Kelas ${x.id}</option>`).join('')}
function schedule(){let d=dayNames[new Date($('date').value+'T00:00:00').getDay()],s=$('session').value,c=$('class').value;let map={Senin:{VII:['Aqidah','Abah Iqin'],VIII:['Fiqih','Ambu Ima'],IX:['Hadist','Ambu Dhilla']},Selasa:{VII:['Hadist','Ambu Dhilla'],VIII:['Aqidah','Abah Iqin'],IX:['Baqu','Abah Deden']},Rabu:{VII:['Fiqih','Ambu Ima'],VIII:['Shiroh','Abah Alam'],IX:['Aqidah','Abah Iqin']},Kamis:{VII:['Shiroh','Abah Alam'],VIII:['Baqu','Abah Deden'],IX:['Fiqih','Ambu Ima']},Jumat:{VII:['Baqu','Abah Deden'],VIII:['Hadist','Ambu Dhilla'],IX:['Shiroh','Abah Alam']}};if(s==='maghrib')return ['Selasa','Rabu','Kamis'].includes(d)?`Leveling Quran • Abah Alam • ${d} • Kelas ${c}`:`Tidak ada Leveling Quran pada ${d}`;if(s==='shubuh')return ['Selasa','Rabu','Kamis','Jumat','Sabtu'].includes(d)?`Halaqah Tahfizh • Abah Dendi • ${d} • Kelas ${c}`:`Tidak ada Halaqah pada ${d}`;let x=map[d]?.[c];return x?`${x[0]} • ${x[1]} • ${d} • Kelas ${c}`:`Tidak ada kelas Kepesantrenan pada ${d}`}
async function refresh(){$('schedule').textContent=schedule();let c=$('class').value;let {data}=await sb.from('students').select('id,name').eq('class_id',c).order('name');students=data||[];let existing={};if(subject){let q=await sb.from('attendance').select('student_id,present').eq('attendance_date',$('date').value).eq('session',$('session').value).eq('class_id',c).eq('subject_id',subject.id);(q.data||[]).forEach(x=>existing[x.student_id]=x.present)}$('students').innerHTML=students.map((x,i)=>`<label class="student"><input type="checkbox" data-id="${x.id}" ${existing[x.id]?'checked':''}><span>${i+1}. ${x.name}</span></label>`).join('');update()}
function update(){let b=[...document.querySelectorAll('.student input')],p=b.filter(x=>x.checked).length;$('present').textContent=p;$('total').textContent=b.length;$('absent').textContent=b.length-p}
async function save(){if(!subject){$('saveMsg').textContent='Mata pelajaran pengajar belum diatur.';return}let rows=[...document.querySelectorAll('.student input')].map(x=>({attendance_date:$('date').value,session:$('session').value,class_id:$('class').value,subject_id:subject.id,student_id:+x.dataset.id,present:x.checked,recorded_by:teacher.id}));let {error}=await sb.from('attendance').upsert(rows,{onConflict:'attendance_date,session,class_id,subject_id,student_id'});$('saveMsg').textContent=error?'Gagal: '+error.message:'✓ Absensi tersimpan online.'}
$('login').onclick=login;$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};$('class').onchange=refresh;$('session').onchange=refresh;$('date').onchange=refresh;document.addEventListener('change',e=>{if(e.target.matches('.student input'))update()});$('save').onclick=save;boot();
</script></body></html>
